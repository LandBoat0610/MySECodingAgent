stages:
  - prepare              # 新增：构建自定义测试镜像
  - lint
  - security
  - test
  - report
  - build

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OPENAI_API_KEY: "test-key-for-ci"
  OPENAI_BASE_URL: "https://ci-test.example.com/v1"
  # Docker 镜像名称，使用 GitLab 内置的 Container Registry
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # 自定义测试镜像的完整名称（固定标签 latest 或者使用 CI_PIPELINE_ID）
  CI_TEST_IMAGE: "$CI_REGISTRY_IMAGE/ci-python:latest"

# ============================================================
# 0. 构建自定义测试镜像（包含所有依赖）
# ============================================================
build_ci_image:
  stage: prepare
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker                    # 明确服务别名，确保主机名可用
  variables:
    # 关闭 TLS，简化连接（在受信任的 CI 环境中安全）
    DOCKER_TLS_CERTDIR: ""
    # 手动指定 Docker 守护进程地址
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # 可选：等待 docker 服务完全就绪
    - until docker info; do sleep 1; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f ci.Dockerfile -t "$CI_TEST_IMAGE" .
    - docker push "$CI_TEST_IMAGE"
  # 暂时移除 only: changes，确保每次流水线都构建镜像（或者先注释掉以验证可用性）
  # only:
  #   changes:
  #     - requirements.txt
  #     - ci.Dockerfile


# 1. 代码风格检查（仍然可以用原始镜像，或者也可以使用自定义镜像）
flake8_lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []
  # 和自定义镜像无关，保持原样

# 2. 安全扫描
bandit_scan:
  stage: security
  image: python:3.11
  script:
    - pip install bandit
    - python -m bandit -r agent/ -ll || echo "Bandit scan skipped"
  allow_failure: true
  needs: []

# ============================================================
# 3. 单元测试 — 使用自定义镜像，不再重复安装依赖
# ============================================================
.test_base:
  # 👇 关键修改：使用我们构建的自定义镜像
  image: $CI_TEST_IMAGE
  # ❌ 删除 before_script 中的 pip install 命令（依赖已在镜像中）
  before_script:
    # 可选：如果有额外需要在运行时安装的包（例如某个测试需要的临时工具），可以保留，但一般不需要
    - echo "Using prebuilt CI image with all dependencies."

pytest_backend:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.backend"
    - python -m pytest tests/test_database.py tests/test_schemas.py tests/test_state.py tests/test_utils.py tests/test_config.py tests/test_platform_settings.py tests/test_eval_storage.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.backend.xml
  artifacts:
    paths:
      - .coverage.backend
      - coverage.xml
    reports:
      junit: junit.backend.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'
  needs: ["build_ci_image"]   # 确保镜像构建完成

pytest_tools:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.tools"
    - python -m pytest tests/test_tools.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.tools.xml
  artifacts:
    paths:
      - .coverage.tools
      - coverage.xml
    reports:
      junit: junit.tools.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'
  needs: ["build_ci_image"]

pytest_llm:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.llm"
    - python -m pytest tests/test_llm.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.llm.xml
  artifacts:
    paths:
      - .coverage.llm
      - coverage.xml
    reports:
      junit: junit.llm.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'
  needs: ["build_ci_image"]

pytest_graph_and_main:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.graph_main"
    - python -m pytest tests/test_graph.py tests/test_main.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.graph_main.xml
  artifacts:
    paths:
      - .coverage.graph_main
      - coverage.xml
    reports:
      junit: junit.graph_main.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'
  needs: ["build_ci_image"]

pytest_eval:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.eval"
    - python -m pytest tests/test_eval_dataset.py tests/test_eval_scoring.py tests/test_eval_security.py tests/test_runtime_metrics.py tests/test_eval_quality.py tests/test_evaluation_jobs.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.eval.xml
  artifacts:
    paths:
      - .coverage.eval
      - coverage.xml
    reports:
      junit: junit.eval.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'
  needs: ["build_ci_image"]

# 4. 前端单元测试（保持不变，因为它用的是 node 镜像）
vitest_frontend:
  stage: test
  image: node:20
  before_script:
    - cd agent/frontend
    - npm install
  script:
    - npx vitest run --coverage --reporter=verbose --reporter=junit --outputFile=junit.xml
  artifacts:
    paths:
      - agent/frontend/coverage/
      - agent/frontend/junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: agent/frontend/coverage/cobertura-coverage.xml
      junit: agent/frontend/junit.xml
    expire_in: 1 day
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  needs: []

# 5. 合并覆盖率（使用自定义镜像也可以）
coverage_merge:
  stage: report
  image: python:3.11   # 或者也可以用 $CI_TEST_IMAGE，但考虑到只需要 coverage 工具，轻量即可
  before_script:
    - python -m pip install coverage
  script:
    - python -m coverage combine .coverage.backend .coverage.tools .coverage.llm .coverage.graph_main .coverage.eval
    - python -m coverage report -m
    - python -m coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_backend
    - pytest_tools
    - pytest_llm
    - pytest_graph_and_main
    - pytest_eval
  coverage: '/TOTAL.*\s+(\d+%)/'

# CD 阶段保持不变
build_docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME/backend:$IMAGE_TAG" -t "$IMAGE_NAME/backend:latest" .
    - docker push "$IMAGE_NAME/backend:$IMAGE_TAG"
    - docker push "$IMAGE_NAME/backend:latest"
    - docker build -t "$IMAGE_NAME/frontend:$IMAGE_TAG" -t "$IMAGE_NAME/frontend:latest" -f agent/frontend/Dockerfile.frontend agent/frontend/
    - docker push "$IMAGE_NAME/frontend:$IMAGE_TAG"
    - docker push "$IMAGE_NAME/frontend:latest"
    - echo "镜像已推送到 GitLab Container Registry"
  only:
    - main
  needs:
    - coverage_merge
    - vitest_frontend