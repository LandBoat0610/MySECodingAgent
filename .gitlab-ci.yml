# .gitlab-ci.yml
stages:
  - lint
  - test

# 1. 代码风格检查
flake8_lint:
  stage: lint
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120 --ignore=E501,W291,W292,W293,E302,E305,E261

# 2. 单元测试
pytest_run:
  stage: test
  script:
    - pip install pytest pyyaml langchain-core
    # 如果有 requirements.txt，使用 pip install -r requirements.txt
    - python -m pytest tests/ -v