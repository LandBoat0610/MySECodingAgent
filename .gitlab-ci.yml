stages:
  - lint
  - security
  - test
  - report

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .venv/  # 如果您之后想恢复 venv，保留也无妨

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OPENAI_API_KEY: "test-key-for-ci"
  OPENAI_BASE_URL: "https://ci-test.example.com/v1"

# 1. 代码风格检查
flake8_lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []

# 2. 安全扫描
bandit_scan:
  stage: security
  image: python:3.11
  script:
    - pip install bandit
    - python -m bandit -r agent/ -ll || echo "Bandit scan skipped (non-critical)"
  allow_failure: true
  needs: []

# 3. 单元测试（分片，使用 --cov-file 代替环境变量）
.test_base:
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script: []  # 由具体 job 覆盖

pytest_backend:
  extends: .test_base
  stage: test
  script:
    - python -m pytest tests/test_database.py tests/test_schemas.py tests/test_state.py tests/test_utils.py tests/test_config.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --cov-file=.coverage.backend
      --junitxml=junit.backend.xml
  artifacts:
    paths:
      - .coverage.backend
      - coverage.xml
    reports:
      junit: junit.backend.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_tools:
  extends: .test_base
  stage: test
  script:
    - python -m pytest tests/test_tools.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --cov-file=.coverage.tools
      --junitxml=junit.tools.xml
  artifacts:
    paths:
      - .coverage.tools
      - coverage.xml
    reports:
      junit: junit.tools.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_llm:
  extends: .test_base
  stage: test
  script:
    - python -m pytest tests/test_llm.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --cov-file=.coverage.llm
      --junitxml=junit.llm.xml
  artifacts:
    paths:
      - .coverage.llm
      - coverage.xml
    reports:
      junit: junit.llm.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_graph_and_main:
  extends: .test_base
  stage: test
  script:
    - python -m pytest tests/test_graph.py tests/test_main.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --cov-file=.coverage.graph_main
      --junitxml=junit.graph_main.xml
  artifacts:
    paths:
      - .coverage.graph_main
      - coverage.xml
    reports:
      junit: junit.graph_main.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

# 4. 合并覆盖率
coverage_merge:
  stage: report
  image: python:3.11
  before_script:
    - pip install coverage
  script:
    - python -m coverage combine .coverage.backend .coverage.tools .coverage.llm .coverage.graph_main
    - python -m coverage report -m
    - python -m coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_backend
    - pytest_tools
    - pytest_llm
    - pytest_graph_and_main
  coverage: '/TOTAL.*\s+(\d+%)/'