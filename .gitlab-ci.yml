stages:
  - lint
  - security
  - test
  - report

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .venv/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Mock OpenAI 密钥，避免 agent 导入时报错
  OPENAI_API_KEY: "test-key-for-ci"
  OPENAI_BASE_URL: "https://ci-test.example.com/v1"

# 1. 代码风格检查
flake8_lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []

# 2. 安全扫描
bandit_scan:
  stage: security
  image: python:3.11
  before_script:
    - pip install bandit
  script:
    - python -m bandit -r agent/ -ll || echo "Bandit scan skipped (non-critical)"
  allow_failure: true
  needs: []

#3. 单元测试（分片执行，生成覆盖率数据）
# 公共安装步骤
.test_base:
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    # 安装项目依赖（请确保仓库根目录有 requirements.txt）
    - pip install -r requirements.txt
    # 安装测试所需额外工具
    - pip install pytest pytest-cov
  script:
    # 这里由子任务覆盖
    - echo "override script"

pytest_backend:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.backend"
    - python -m pytest tests/test_database.py tests/test_schemas.py tests/test_state.py tests/test_utils.py tests/test_config.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.backend.xml
  artifacts:
    paths:
      - .coverage.backend
      - coverage.xml
    reports:
      junit: junit.backend.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_tools:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.tools"
    - python -m pytest tests/test_tools.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.tools.xml
  artifacts:
    paths:
      - .coverage.tools
      - coverage.xml
    reports:
      junit: junit.tools.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_llm:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.llm"
    - python -m pytest tests/test_llm.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.llm.xml
  artifacts:
    paths:
      - .coverage.llm
      - coverage.xml
    reports:
      junit: junit.llm.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_graph_and_main:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.graph_main"
    - python -m pytest tests/test_graph.py tests/test_main.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.graph_main.xml
  artifacts:
    paths:
      - .coverage.graph_main
      - coverage.xml
    reports:
      junit: junit.graph_main.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

# 4. 合并覆盖率报告
coverage_merge:
  stage: report
  image: python:3.11
  before_script:
    - pip install coverage
  script:
    - python -m coverage combine .coverage.backend .coverage.tools .coverage.llm .coverage.graph_main
    - python -m coverage report -m
    - python -m coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_backend
    - pytest_tools
    - pytest_llm
    - pytest_graph_and_main
  coverage: '/TOTAL.*\s+(\d+%)/'