stages:
  - lint
  - security
  - test
  - report

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .venv/

# 1. 代码风格检查
flake8_lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []

# 2. 安全扫描
bandit_scan:
  stage: security
  image: python:3.11
  before_script:
    - pip install bandit
  script:
    - python -m bandit -r agent/ -ll || echo "Bandit scan skipped (non-critical)"
  allow_failure: true
  needs: []

# 3. 单元测试（并行，添加 JUnit 报告）
pytest_utils:
  stage: test
  image: python:3.11
  before_script:
    - pip install pytest pyyaml langchain-core pytest-cov
  script:
    - $env:COVERAGE_FILE = ".coverage.utils"
    - python -m pytest tests/test_utils.py tests/test_config.py tests/test_state.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.utils.xml
  artifacts:
    paths:
      - .coverage.utils
      - coverage.xml
    reports:
      junit: junit.utils.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_tools:
  stage: test
  image: python:3.11
  before_script:
    - pip install pytest pyyaml langchain-core pytest-cov
  script:
    - $env:COVERAGE_FILE = ".coverage.tools"
    - python -m pytest tests/test_tools.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.tools.xml
  artifacts:
    paths:
      - .coverage.tools
      - coverage.xml
    reports:
      junit: junit.tools.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_llm:
  stage: test
  image: python:3.11
  before_script:
    - pip install pytest pyyaml langchain-core pytest-cov
  script:
    - $env:COVERAGE_FILE = ".coverage.llm"
    - python -m pytest tests/test_llm.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.llm.xml
  artifacts:
    paths:
      - .coverage.llm
      - coverage.xml
    reports:
      junit: junit.llm.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_graph:
  stage: test
  image: python:3.11
  before_script:
    - pip install pytest pyyaml langchain-core pytest-cov
  script:
    - $env:COVERAGE_FILE = ".coverage.graph"
    - python -m pytest tests/test_graph.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.graph.xml
  artifacts:
    paths:
      - .coverage.graph
      - coverage.xml
    reports:
      junit: junit.graph.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

# 4. 合并覆盖率报告
coverage_merge:
  stage: report
  image: python:3.11
  before_script:
    - pip install coverage
  script:
    - python -m coverage combine .coverage.utils .coverage.tools .coverage.llm .coverage.graph
    - python -m coverage report -m
    - python -m coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_utils
    - pytest_tools
    - pytest_llm
    - pytest_graph
  coverage: '/TOTAL.*\s+(\d+%)/'