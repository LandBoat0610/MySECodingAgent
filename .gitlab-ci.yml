stages:
  - lint
  - security
  - test
  - report
  - build
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OPENAI_API_KEY: "test-key-for-ci"
  OPENAI_BASE_URL: "https://ci-test.example.com/v1"
  IMAGE_NAME: "agent-platform"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  CI_TEST_IMAGE: "ci-python:latest"

# 1. 代码风格检查
flake8_lint:
  stage: lint
  image: ${CI_TEST_IMAGE}
  script:
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []

# 2. 安全扫描
bandit_scan:
  stage: security
  image: ${CI_TEST_IMAGE}
  script:
    - python -m bandit -r agent/ -ll || echo "Bandit scan skipped"
  allow_failure: true
  needs: []

# ============================================================
# 3. 单元测试 — 使用预装依赖的 ci-python 镜像，跳过 pip install
# ============================================================
.test_base:
  image: ${CI_TEST_IMAGE}
  before_script:
    - echo "Using prebuilt CI image with all dependencies."

pytest_backend:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.backend"
    - python -m pytest tests/test_database.py tests/test_schemas.py tests/test_state.py tests/test_utils.py tests/test_config.py tests/test_platform_settings.py tests/test_eval_storage.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.backend.xml
  artifacts:
    paths:
      - .coverage.backend
      - coverage.xml
    reports:
      junit: junit.backend.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_tools:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.tools"
    - python -m pytest tests/test_tools.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.tools.xml
  artifacts:
    paths:
      - .coverage.tools
      - coverage.xml
    reports:
      junit: junit.tools.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_llm:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.llm"
    - python -m pytest tests/test_llm.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.llm.xml
  artifacts:
    paths:
      - .coverage.llm
      - coverage.xml
    reports:
      junit: junit.llm.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_graph_and_main:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.graph_main"
    - python -m pytest tests/test_graph.py tests/test_main.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.graph_main.xml
  artifacts:
    paths:
      - .coverage.graph_main
      - coverage.xml
    reports:
      junit: junit.graph_main.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

pytest_eval:
  extends: .test_base
  stage: test
  script:
    - export COVERAGE_FILE=".coverage.eval"
    - python -m pytest tests/test_eval_dataset.py tests/test_eval_scoring.py tests/test_eval_security.py tests/test_runtime_metrics.py tests/test_eval_quality.py tests/test_evaluation_jobs.py
      --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=junit.eval.xml
  artifacts:
    paths:
      - .coverage.eval
      - coverage.xml
    reports:
      junit: junit.eval.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)/'

# 4. 前端单元测试
vitest_frontend:
  stage: test
  image: node:20
  before_script:
    - cd agent/frontend
    - npm install
  script:
    - npx vitest run --coverage --reporter=verbose --reporter=junit --outputFile=junit.xml
  artifacts:
    paths:
      - agent/frontend/coverage/
      - agent/frontend/junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: agent/frontend/coverage/cobertura-coverage.xml
      junit: agent/frontend/junit.xml
    expire_in: 1 day
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  needs: []

# 5. 合并覆盖率
coverage_merge:
  stage: report
  image: ${CI_TEST_IMAGE}
  before_script:
    - echo "使用预装依赖的 CI 镜像"
  script:
    - python -m coverage combine .coverage.backend .coverage.tools .coverage.llm .coverage.graph_main .coverage.eval
    - python -m coverage report -m
    - python -m coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_backend
    - pytest_tools
    - pytest_llm
    - pytest_graph_and_main
    - pytest_eval
  coverage: '/TOTAL.*\s+(\d+%)/'

# ============================================================
# CD 阶段：通过宿主机 Docker socket 构建镜像（需要 Windows runner）
# 注意：这两个 job 需要跑在有 Docker socket 挂载的 runner 上
#       Registry 未开启，镜像仅存本地 Docker daemon
# ============================================================
build_docker:
  stage: build
  image: docker:24
  timeout: 1h
  tags:
    - docker
  script:
    - echo "Building backend image..."
    - docker build -t "$IMAGE_NAME/backend:$IMAGE_TAG" -t "$IMAGE_NAME/backend:latest" .
    - echo "Backend image built successfully"
    - echo "Building frontend image..."
    - docker build -t "$IMAGE_NAME/frontend:$IMAGE_TAG" -t "$IMAGE_NAME/frontend:latest" -f agent/frontend/Dockerfile.frontend agent/frontend/
    - echo "Frontend image built successfully"
    - echo "All images built successfully (local Docker daemon only)"
    - echo "Images:"
    - docker images "$IMAGE_NAME/*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "cicd"

  needs:
    - coverage_merge
    - vitest_frontend

# CD 部署阶段：本地部署（需要 Windows runner + Docker socket）
deploy_local:
  stage: deploy
  image: docker:24
  timeout: 10m
  tags:
    - docker
  script:
    - echo "Starting local deployment..."
    - echo "  Stopping old containers..."
    - docker-compose down || true
    - echo "  Starting new containers (using pre-built images, no rebuild)..."
    - docker-compose up -d --no-build
    - echo "Waiting for service to be ready (up to 90 seconds)..."
    - |
      SUCCESS=false
      for i in $(seq 1 18); do
        echo "  Check ${i}: curl /health..."
        HEALTH_RESP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")

        if [ "$HEALTH_RESP" = "200" ]; then
          echo "Backend /health returned 200, service is ready"
          SUCCESS=true
          break
        fi

        backend_running=$(docker inspect -f '{{.State.Running}}' agent-backend 2>/dev/null || echo "false")
        frontend_running=$(docker inspect -f '{{.State.Running}}' agent-frontend 2>/dev/null || echo "false")
        echo "  Backend running: $backend_running, Frontend running: $frontend_running, HTTP: $HEALTH_RESP"

        if [ $i -eq 18 ]; then
          echo "Deploy failed! Service not ready within 90 seconds"
          echo "  Backend container logs:"
          docker logs --tail 50 agent-backend 2>/dev/null || echo "  Backend container not found"
          echo "  Frontend container logs:"
          docker logs --tail 20 agent-frontend 2>/dev/null || echo "  Frontend container not found"
          exit 1
        fi

        sleep 5
      done

      if [ "$SUCCESS" = "true" ]; then
        echo "Deploy successful! Services are running"
        echo "  Backend API: http://localhost:8000"
        echo "  API Docs:    http://localhost:8000/docs"
        echo "  Frontend:    http://localhost:3000"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "cicd"

  needs:
    - build_docker
  environment:
    name: production
    url: http://localhost:3000
