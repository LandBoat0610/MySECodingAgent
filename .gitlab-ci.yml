# .gitlab-ci.yml
stages:
  - lint
  - test

# 1. 代码风格检查
flake8_lint:
  stage: lint
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120 
  allow_failure: true

# 2. 单元测试
pytest_run:
  stage: test
  script:
    - pip install pytest pyyaml langchain-core pytest-cov
    # 如果有 requirements.txt，使用 pip install -r requirements.txt
    - python -m pytest tests/ -v
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml