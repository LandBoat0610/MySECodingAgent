stages:
  - lint
  - security
  - test
  - report

# 缓存 pip 包，加速后续安装
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .venv/

# 公共安装步骤（仅用于测试作业）
.test_before_script: &test_before_script
  before_script:
    - pip install pytest pyyaml langchain-core pytest-cov

# 1. 代码风格检查
flake8_lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - python -m flake8 agent/ tests/ --max-line-length=120
  allow_failure: true
  needs: []

# 2. 安全扫描（修复 bandit 调用)
bandit_scan:
  stage: security
  image: python:3.11
  before_script:
    - pip install bandit
  script:
    - python -m bandit -r agent/ -ll || echo "Bandit scan failed (non-critical)"
  allow_failure: true
  needs: []

# 3. 单元测试（并行）
pytest_utils:
  stage: test
  image: python:3.11
  <<: *test_before_script
  script:
    # 直接列出文件，用空格分隔，pwsh 会正确传递给 pytest
    - python -m pytest tests/test_utils.py tests/test_config.py tests/test_state.py --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 day

pytest_tools:
  stage: test
  image: python:3.11
  <<: *test_before_script
  script:
    - python -m pytest tests/test_tools.py --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 day

pytest_llm:
  stage: test
  image: python:3.11
  <<: *test_before_script
  script:
    - python -m pytest tests/test_llm.py --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 day

pytest_graph:
  stage: test
  image: python:3.11
  <<: *test_before_script
  script:
    - python -m pytest tests/test_graph.py --cov=agent/ --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 day

# 4. 合并覆盖率报告（需要所有测试作业完成）
coverage_merge:
  stage: report
  image: python:3.11
  before_script:
    - pip install coverage
  script:
    - coverage combine
    - coverage report -m
    - coverage xml -o coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  needs:
    - pytest_utils
    - pytest_tools
    - pytest_llm
    - pytest_graph
  coverage: '/TOTAL.*\s+(\d+%)/'