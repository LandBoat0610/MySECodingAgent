# ================================================================
# Agent Platform - 生产部署 Compose 文件
# 使用预构建镜像，不执行本地构建
#
# 用法：
#   生产部署：docker-compose up -d
#   指定版本：IMAGE_TAG=abc1234 docker-compose up -d
#   拉取远程镜像：IMAGE_NAME=registry.gitlab.com/group/project docker-compose up -d
#
# 本地开发请使用：docker-compose -f docker-compose.dev.yml up --build
# ================================================================

services:
  # 后端服务 (FastAPI + Uvicorn)
  backend:
    image: ${IMAGE_NAME:-agent-platform}/backend:${IMAGE_TAG:-latest}
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化 SQLite 数据库和 workspace 文件
      - agent_data:/app/data
      - agent_workspaces:/app/workspaces
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 前端服务 (Vue 3 + Vite -> nginx 静态托管)
  frontend:
    image: ${IMAGE_NAME:-agent-platform}/frontend:${IMAGE_TAG:-latest}
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - agent-net

volumes:
  agent_data:
    driver: local
  agent_workspaces:
    driver: local

networks:
  agent-net:
    driver: bridge
